# Time-of-day scenarios for Dhaka. Field reference: docs/regions.md.
#
# Volumes are rough guesses tuned so the Farmgate area shows the qualitative
# pattern Dhaka residents know: free-ish midday, gridlock at rush hour, empty
# roads on Friday morning. They are vehicles per hour for Farmgate (the
# reference area in region.toml); other areas scale them by main-road lane-km.
#
# The mix follows the mid-2023 RSTP road survey (motorcycles 27%, non-motorised
# 22%, cars 20%, three-wheelers 14%, trucks/pickups 6%, buses 3%; Bonik Barta,
# 2025-04-28), updated for what happened after August 2024: roughly 400,000 more
# battery rickshaws (BUET, via TBS 2026-08-31), which now outnumber pedal
# rickshaws. Volumes were raised ~15% over the pre-2024 model for the same reason.
# Trucks are only allowed into the city after 10 pm.
#
# mix keys are vehicle type ids from vtypes.py; values are relative weights.

[[presets]]
id = "morning_rush"
label = "Morning rush"
description = "8–10 am: offices, schools. Heavy through traffic."
start_hour = 8.0
volume = 9000
through_share = 0.65
mix = { car = 23, bus = 6, cng = 11, e_rickshaw = 27, motorcycle = 28, truck = 2, rickshaw = 3 }

[[presets]]
id = "midday"
label = "Midday"
description = "12–3 pm: steady local trips, battery rickshaws everywhere."
start_hour = 12.0
volume = 5200
through_share = 0.5
mix = { car = 20, bus = 5, cng = 11, e_rickshaw = 34, motorcycle = 24, truck = 2, rickshaw = 4 }

[[presets]]
id = "evening_rush"
label = "Evening rush"
description = "5–8 pm: everyone heading home at once."
start_hour = 17.0
volume = 11000
through_share = 0.65
mix = { car = 24, bus = 6, cng = 11, e_rickshaw = 26, motorcycle = 28, truck = 2, rickshaw = 3 }

[[presets]]
id = "friday"
label = "Friday morning"
description = "Weekend: light traffic, mostly local."
start_hour = 10.0
volume = 2300
through_share = 0.4
mix = { car = 20, bus = 4, cng = 12, e_rickshaw = 38, motorcycle = 21, truck = 1, rickshaw = 4 }

[[presets]]
id = "night"
label = "Night (trucks allowed)"
description = "After 10 pm: trucks enter the city; battery rickshaws still out."
start_hour = 22.0
volume = 2900
through_share = 0.75
mix = { car = 26, bus = 7, cng = 11, e_rickshaw = 18, motorcycle = 18, truck = 19, rickshaw = 1 }
