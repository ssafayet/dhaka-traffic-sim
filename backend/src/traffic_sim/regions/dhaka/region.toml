# Dhaka region pack. Field reference: docs/regions.md.
# Check after editing: uv run traffic-sim-region check dhaka

name = "Dhaka"
country = "Bangladesh"
driving_side = "left"
default_area = "farmgate"
default_preset = "morning_rush"  # an id in presets.toml

[demand]
# Preset volumes (presets.toml) are vehicles per hour on this area. Every other
# area scales them by its main-road lane-km over reference_main_lane_km.
reference_area = "farmgate"
reference_main_lane_km = 129.2  # "main_lane_km" in data/areas/farmgate/area.json
# Presets' through-traffic shares are for a neighbourhood, where most traffic is
# passing through. Across the whole city most trips start and end inside.
city_through_scale = 0.25

[network]
# Loaded after SUMO's osmNetconvert.typ.xml: the rickshaw main-road rule.
type_files = ["roads.typ.xml"]

# Areas `traffic-sim-prepare` can build. bbox = [west, south, east, north].
#
# kind "city": the whole city on main roads only (detail "arterial"), so tens
#   of thousands of vehicles still simulate at interactive speed.
# kind "area" (default): one neighbourhood, every street, about 3 × 3 km.

[areas.dhaka]
name = "Whole city (Dhaka North + South)"
kind = "city"
detail = "arterial"
bbox = [90.330, 23.685, 90.500, 23.885]

